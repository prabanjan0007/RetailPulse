services:
  postgres:
    image: postgres:16-alpine
    container_name: retailpulse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailpulse} -d ${POSTGRES_DB:-retailpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
